[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dsl-agent"
version = "0.1.0"
description = "DSL Reference Implementation - License Broker"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "websockets>=12.0",
    "click>=8.1.0",
    "pyjwt[crypto]>=2.8.0",
]

[project.scripts]
dsl-agent = "dsl_agent.__main__:cli"

[tool.setuptools.packages.find]
include = ["dsl_agent*"]
