[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dsl-sdk"
version = "0.1.0"
description = "DSL Reference Implementation - Application SDK"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "pyjwt[crypto]>=2.8.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["dsl_sdk*"]
